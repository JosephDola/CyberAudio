name: Build NULLGate 1.21.11

on:
  push:
    branches: [ nullportal-1.21.11 ]
    paths:
      - 'nullgate/**'
      - '.github/workflows/nullgate-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile NULLGate
        working-directory: nullgate
        run: gradle --no-daemon build
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: NULLGate-0.1.0-MC1.21.11
          path: nullgate/build/libs/nullgate-0.1.0.jar
          if-no-files-found: error
